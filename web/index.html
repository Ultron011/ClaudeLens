    <!--
      IMPECCABLE DIRECTION CONTRACT — ClaudeLens dashboard

      THESIS: A team's Claude Code usage read like an instrument panel, not a report. It refuses
      the dark-SaaS-admin arrangement the old build shipped: a page of same-size cards floating in
      half-empty width with no way to reach a second route.
      OWN-WORLD: Light — a soft green-tinted grey ground (#f3f5f3) with white cards and a white
      rail, so cards lift on a shadow rather than being outlined onto the page. One deep emerald
      (#157551) for current-selection, primary metric and state; exactly one solid-emerald KPI
      tile per band. A separate six-slot categorical ramp for genuinely categorical marks only,
      and one constant --viz-primary for every single-series chart. Authored 16px stroke-1.5 SVG
      icons, one weight throughout. Tabular numerals everywhere a number can change.
      STORY: A teammate lands, sees who is spending effort where, and drills person → project →
      session → transcript without ever losing the rail or wondering where analytics went.
      FIRST VIEWPORT: Persistent 248px rail (brand, routes, live people list) at left; sticky
      breadcrumb bar; then an unequal bento — a primary KPI band, a wide activity chart paired with
      a narrower model-share ring, then the people table. Never a uniform card grid.
      FORM: Instrument panel / dense operations console. Brief-pinned by the user to
      references/dribble-ref-01..04 + shadcn dashboard, so the direction roll is superseded
      (a user-pinned direction beats the roll); no seed key.
      FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review,
      the verdict, and DESIGN.md
    -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
